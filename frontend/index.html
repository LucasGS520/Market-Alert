<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Market Alert</title>
  <meta name="viewport" content="width=1280"/>
  <link rel="stylesheet" href="styles/colors-and-type.css"/>
  <link rel="stylesheet" href="styles/ui-kit.css"/>
  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml"/>
</head>
<body>
  <div id="root"></div>

  <!-- Bootstrap estatico: bibliotecas globais precisam existir antes dos arquivos da aplicacao. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Ordem contratual: API/helpers primeiro, pois telas e componentes consomem esses globais. -->
  <script src="src/api/formatters.js"></script>
  <script src="src/api/mappers.js"></script>
  <script src="src/api/client.js"></script>

  <!-- Componentes base antes de layout, overlays e telas. Nao ha import/export nesta UI. -->
  <script type="text/babel" src="src/components/icons.jsx"></script>
  <script type="text/babel" src="src/components/buttons.jsx"></script>
  <script type="text/babel" src="src/components/badges.jsx"></script>
  <script type="text/babel" src="src/components/cards.jsx"></script>
  <script type="text/babel" src="src/components/charts.jsx"></script>

  <script type="text/babel" src="src/layout/Sidebar.jsx"></script>
  <script type="text/babel" src="src/layout/TopBar.jsx"></script>

  <script type="text/babel" src="src/overlays/NotificationsPanel.jsx"></script>
  <script type="text/babel" src="src/overlays/AddProductModal.jsx"></script>

  <script type="text/babel" src="src/screens/monitors/Monitors.jsx"></script>
  <script type="text/babel" src="src/screens/monitors/MonitorTable.jsx"></script>
  <script type="text/babel" src="src/screens/dashboard/DashboardCards.jsx"></script>
  <script type="text/babel" src="src/screens/dashboard/Dashboard.jsx"></script>
  <script type="text/babel" src="src/screens/alerts/AlertCard.jsx"></script>
  <script type="text/babel" src="src/screens/alerts/Alerts.jsx"></script>
  <script type="text/babel" src="src/screens/product-detail/PriceChart.jsx"></script>
  <script type="text/babel" src="src/screens/product-detail/CollectionDiagnostic.jsx"></script>
  <script type="text/babel" src="src/screens/product-detail/AddCompetitorInline.jsx"></script>
  <script type="text/babel" src="src/screens/product-detail/ProductDetail.jsx"></script>

  <!-- App entra por ultimo porque orquestra todos os globais registrados acima. -->
  <script type="text/babel" src="src/app/App.jsx"></script>
</body>
</html>
