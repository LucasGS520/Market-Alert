[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market_scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "curl-cffi==0.7.3",
    "playwright==1.49.0",
    "extruct==0.17.0",
    "parsel==1.9.1",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "httpx==0.28.1",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
